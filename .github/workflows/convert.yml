name: Build MRS Rulesets

on:
  workflow_dispatch:
  schedule:
    # 每周一北京时间早晨 06:00 (UTC 每周日 22:00) 自动同步上游规则
    - cron: '0 22 * * 0'
  push:
    branches:
      - main
    paths-ignore:
      - 'rule/geosite/**'

jobs:
  convert-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mihomo
        run: |
          echo "Downloading latest Mihomo binary..."
          MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-compatible-v1.19.31.gz"
          curl -sSL "$MIHOMO_URL" | gzip -d > /usr/local/bin/mihomo
          chmod +x /usr/local/bin/mihomo
          mihomo -v

      - name: Run Rule Conversion
        run: |
          python convert.py --mihomo-bin /usr/local/bin/mihomo --output-dir rule/geosite

      - name: Commit and push generated MRS files
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A rule/geosite/
          
          if git diff --staged --quiet; then
            echo "No changes detected in rule/geosite."
          else
            echo "Changes detected, committing and pushing to repository..."
            git commit -m "chore(ruleset): update geosite mrs rulesets via github actions [skip ci]"
            git push
          fi
